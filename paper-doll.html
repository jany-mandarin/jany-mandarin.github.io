<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1824;--ink:#f1e9f7;--muted:#b3a6c0;--chip:#2b2434;--line:#443a52;--on:#ffd86b;--on-t:#2a2132}}
:root[data-theme="dark"]{--bg:#1d1824;--ink:#f1e9f7;--muted:#b3a6c0;--chip:#2b2434;--line:#443a52;--on:#ffd86b;--on-t:#2a2132}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:500;line-height:1.5}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0;text-align:center;line-height:1.3}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:0 0 18px}.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}.seg{display:flex;gap:6px}
rt{font-size:.66em;color:var(--muted);font-weight:500}
h1 rt{font-size:.4em}.lb rt{font-size:.8em}.en{font-size:11px;opacity:.72;font-weight:500}h1 .en{display:block;font-size:14px;margin-top:2px}h3 .zh,h3 .en{display:inline}h3 .en{margin-left:8px}.btn rt,.chip[aria-pressed="true"] rt{color:inherit;opacity:.85}
.wrap{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:20px;align-items:start}
.left{position:sticky;top:12px}
.stage{background:#f7d6bf;border-radius:14px;padding:10px 10px 4px}
.stage svg{width:100%;height:auto;max-height:calc(100vh - 110px);display:block}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;font:inherit;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:0;border-radius:999px;padding:10px 12px;cursor:pointer;background:var(--pink);color:#3b1020}
.btn.alt{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.grp{background:var(--chip);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
h3{font-size:15px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.lb{font-size:13px;color:var(--muted);min-width:50px;display:inline-flex;flex-direction:column;align-items:flex-start}
.chip{font:inherit;line-height:1.35;display:inline-flex;flex-direction:column;align-items:center;font-size:14px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-t);border-color:var(--on)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--chip);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--on)}
input[type=range]{flex:1;min-width:120px;accent-color:#ff6f91}
@media(max-width:720px){.wrap{grid-template-columns:1fr}.left{position:static}.stage{max-width:300px;margin:0 auto;width:100%}.top{grid-template-columns:1fr}.top span{display:none}.bar{justify-content:center}}
</style>
</head>

}
const chips=(k,o)=>`<div class="row">`+o.map(([v,t])=>`<button class="chip" type="button" data-k="${k}" data-v="${v}" aria-pressed="${s[k]===v}">${tx(t)}</button>`).join('')+'</div>';
const sw=(k,lab,c)=>`<div class="row"><span class="lb">${tx(lab)}</span>`+c.map(v=>`<button class="sw" type="button" style="background:${v}" data-k="${k}" data-v="${v}" aria-label="${lab} ${v}" aria-pressed="${s[k]===v}"></button>`).join('')+'</div>';
const sl=(k,lab)=>`<div class="row"><span class="lb">${tx(lab)}</span><input type="range" min="${SLD[k][0]}" max="${SLD[k][1]}" step=".05" value="${s[k]}" data-s="${k}" aria-label="${lab}"></div>`;
const G=(k,...r)=>`<section class="grp"><h3>${tx(k)}</h3>${r.join('')}</section>`;
function panel(){
 $('panel').innerHTML=G('性別',chips('g',GEN))+G('臉形',chips('face',FACE),sw('skin','膚色',SK))
 +G('眼睛',sl('eye','大小'),sw('ec','顏色',EC))+G('鼻子',sl('nose','大小'))+G('嘴巴',sl('mouth','大小'),sw('lc','顏色',LC))+G('耳朵',sl('ear','大小'))
 +G('髮型',chips('hair',HAIR),sw('hc','顏色',HC))+G('鬍子',`<div class="row">`+[['none','沒有鬍子'],['mus','嘴巴上'],['goat','嘴巴下']].map(([v,t])=>`<button class="chip" type="button" data-bd="${v}" aria-pressed="${v==='none'?!(s.bd.mus||s.bd.goat):!!s.bd[v]}">${tx(t)}</button>`).join('')+'</div>',sw('bdc','顏色',HC))+G('上半身',chips('top',TOP),sw('tc','顏色',CL))+G('下半身',chips('bot',BOT),sw('bc','顏色',CL))
 +G('外套',chips('jk',JK),sw('jc','顏色',CL))+G('鞋子',sw('sc','顏色',CL))
 +G('配件',`<div class="row"><span class="lb">Multi-select</span>`+ACC.map(([k,t])=>`<button class="chip" type="button" data-acc="${k}" aria-pressed="${!!s.acc[k]}">${tx(t)}</button>`).join('')+'</div>');
}
function chrome(){
 $('ttl').innerHTML=tx('紙娃娃遊戲');document.title=ui.s?'纸娃娃游戏':'紙娃娃遊戲';document.documentElement.lang=ui.s?'zh-Hans':'zh-Hant';
 $('rnd').innerHTML=tx('隨機搭配');$('rst').innerHTML=tx('重設');
 document.querySelectorAll('[data-u]').forEach(b=>{const u=b.dataset.u;b.setAttribute('aria-pressed',u==='py'?!!ui.p:u==='en'?!!ui.e:u==='simp'?!!ui.s:!ui.s);});
}
document.querySelector('.bar').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const u=b.dataset.u;
 if(u==='py')ui.p=ui.p?0:1;else if(u==='en')ui.e=ui.e?0:1;else ui.s=u==='simp'?1:0;
 try{localStorage.setItem('pdui',JSON.stringify(ui))}catch(x){}
 chrome();panel();
});
$('panel').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.bd){const v=b.dataset.bd;if(v==='none')s.bd={mus:0,goat:0};else s.bd[v]=s.bd[v]?0:1;}else if(b.dataset.acc)s.acc[b.dataset.acc]=s.acc[b.dataset.acc]?0:1;else s[b.dataset.k]=b.dataset.v;
 draw();panel();
});
$('panel').addEventListener('input',e=>{const k=e.target.dataset.s;if(k){s[k]=+e.target.value;draw();}});
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('rnd').onclick=()=>{
 [['g',GEN],['face',FACE],['hair',HAIR],['top',TOP],['bot',BOT],['jk',JK]].forEach(([k,o])=>s[k]=pick(o)[0]);
 [['skin',SK],['hc',HC],['bdc',HC],['ec',EC],['lc',LC],['tc',CL],['bc',CL],['jc',CL],['sc',CL]].forEach(([k,c])=>s[k]=pick(c));
 for(const k in SLD)s[k]=+(SLD[k][0]+Math.random()*(SLD[k][1]-SLD[k][0])).toFixed(2);
 ACC.forEach(([k])=>s.acc[k]=Math.random()<.3?1:0);
 s.bd={mus:Math.random()<.25?1:0,goat:Math.random()<.25?1:0};
 draw();panel();
};
$('rst').onclick=()=>{s=DEF();draw();panel();};
draw();chrome();panel();
</script>
</body>
</html>
