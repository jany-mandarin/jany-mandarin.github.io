    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            if (window.innerWidth <= 900) {
                sidebar.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('expanded');
            }
        }

        function parsePinyin(text) {
            const regex = /([一-龥a-zA-Z0-9，。？！、：""''()./])\((.*?)\)/g;
            let parsed = text.replace(regex, (match, char, py) => {
                return `<span class="pinyin-group"><span class="py-text">${py}</span><span class="hz-text">${char}</span></span>`;
            });
            return parsed;
        }

        let currentUtterance = null;
        function playAudio(text) {
            let cleanText = text.replace(/\(.*?\)/g, '');
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                if (currentUtterance === cleanText) {
                    currentUtterance = null;
                    return;
                }
            }
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.onend = () => { currentUtterance = null; };
            currentUtterance = cleanText;
            speechSynthesis.speak(utterance);
        }

        let mediaRecorders = {};
        let audioUrls = {};

        async function toggleRecord(btn, id) {
            if (!mediaRecorders[id] || mediaRecorders[id].state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let chunks = [];
                    let recorder = new MediaRecorder(stream);
                    
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { 'type': 'audio/ogg; codecs=opus' });
                        audioUrls[id] = URL.createObjectURL(blob);
                        const playerContainer = document.getElementById(`audio-container-${id}`);
                        playerContainer.innerHTML = `<audio controls src="${audioUrls[id]}"></audio>`;
                    };

                    recorder.start();
                    mediaRecorders[id] = recorder;
                    btn.innerHTML = "⏹️";
                    btn.classList.add("recording");
                } catch (err) {
                    alert("麦克风权限被拒绝或不支持。");
                }
            } else {
                mediaRecorders[id].stop();
                btn.innerHTML = "🎤";
                btn.classList.remove("recording");
            }
        }

        const lessonData = [

                        note: "解释：用在医院人员分析食物或产品。<br>Explanation: Inspection / Laboratory testing.",
                        examples: [
                            { zh: "我(wǒ)在(zài)超(chāo)市(shì)买(mǎi)到(dào)不(bù)新(xīn)鲜(xiān)的(de)肉(ròu)，中(zhòng)毒(dú)后(hòu)，卫(wèi)生(shēng)署(shǔ)就(jiù)有(yǒu)派(pài)人(rén)去(qù)那(nà)家(jiā)超(chāo)市(shì)检(jiǎn)验(yàn)肉(ròu)。", en: "I bought unfresh meat at the supermarket. After getting poisoned, the Department of Health sent people to that supermarket to test the meat." },

        const container = document.getElementById('content');

        lessonData.forEach((sec, sIdx) => {
            let html = `<div class="section" id="sec-${sIdx}">`;

            sec.items.forEach((item, iIdx) => {
                if (item.type === "html") {
                    html += item.content;
                } else if (item.type === "table") {
                    let tblClass = item.tableClass ? `custom-table ${item.tableClass}` : "custom-table";
                    html += `<div class="grammar-box" id="item-${sIdx}-${iIdx}">`;
                    html += `<table class="${tblClass}"><thead><tr>`;
                    item.headers.forEach(h => { html += `<th>${parsePinyin(h)}</th>`; });
                    html += `</tr></thead><tbody>`;
                    item.rows.forEach(row => {
                        html += `<tr>`;
                        row.forEach(cell => { html += `<td>${parsePinyin(cell)}</td>`; });
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else if (item.type === "grammar") {
                    html += `<div class="grammar-box" id="item-${sIdx}-${iIdx}">
                        <div style="font-weight:bold; font-size:16px; color:#8C6239; margin-bottom:5px;">${parsePinyin(item.title)}</div>`;
                    if(item.note) html += `<div class="note">${parsePinyin(item.note)}</div>`;
                    
                    if (item.examples) {
                        item.examples.forEach(ex => {
                            html += `
                            <div class="item" style="border:none; margin-top:10px; padding-bottom:0;">
                                <div class="item-content">
                                    <button class="icon-btn" onclick="playAudio('${ex.zh}')" title="朗读">🔊</button>
                                    <button class="icon-btn rec-btn" onclick="toggleRecord(this, 'rec-${counter}')" title="录音">🎤</button>
                                    <button class="icon-btn play-rec-btn" id="play-rec-rec-${counter}" onclick="playRecording('rec-${counter}')" disabled title="播放自己">▶</button>
                                </div>
                                <div class="audio-player-container" id="audio-container-rec-${counter}"></div>
                                <div style="margin-top:5px;">${parsePinyin(ex.zh)}</div>
                                <div class="en-trans">${ex.en}</div>
                            </div>`;
                            counter++;
                        });
                    }
                    html += `</div>`;
                }
            });
            html += `</div>`;
            container.innerHTML += html;
        });

        function togglePinyin() {
            document.body.classList.toggle('hide-pinyin');
        }

        function toggleEnglish() {
            document.body.classList.toggle('hide-english');
        }
    </script>
</body>
</html>
