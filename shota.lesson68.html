        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');

            } else {
                sidebar.classList.toggle('collapsed');

        function parsePinyin(text) {
            const regex = /([一-龥a-zA-Z0-9，。？！、：""''])\((.*?)\)/g;
            let parsed = text.replace(regex, (match, char, py) => {
                return `<span class="pinyin-group"><span class="py-text">${py}</span><span class="hz-text">${char}</span></span>`;
            });
            return parsed;
        }

        let currentUtterance = null;
        let activePlayBtn = null;

        function togglePlayAudio(text, btnId) {
            const btn = document.getElementById(btnId);

            if (speechSynthesis.speaking) {
                if (speechSynthesis.paused) {
                    speechSynthesis.resume();
                    if(btn) btn.classList.add("playing");
                    return;
                } else {
                    speechSynthesis.cancel();
                    if(activePlayBtn) activePlayBtn.classList.remove("playing");
                    if(activePlayBtn === btn) {
                        activePlayBtn = null;
                        return;
                    }
                }
            }

            let cleanText = text.replace(/<[^>]*>/g, '')
                                .replace(/\(.*?\)/g, '')
                                .replace(/^[a-zA-Z]:\s*/g, '')
                                .replace(/^\d+\.\s*/, '');

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85;

            utterance.onstart = () => {
                if(activePlayBtn) activePlayBtn.classList.remove("playing");
                activePlayBtn = btn;
                if(btn) btn.classList.add("playing");
            };

            utterance.onend = () => {
                if(btn) btn.classList.remove("playing");
                activePlayBtn = null;
            };

            utterance.onerror = () => {
                if(btn) btn.classList.remove("playing");
                activePlayBtn = null;
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);
        }

        let mediaRecorders = {};
        let audioUrls = {};

        async function toggleRecord(btn, id) {
            if (!mediaRecorders[id] || mediaRecorders[id].state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let chunks = [];
                    let recorder = new MediaRecorder(stream);

                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { 'type': 'audio/webm' });
                        audioUrls[id] = URL.createObjectURL(blob);
                        let playRecBtn = document.getElementById(`play-rec-${id}`);
                        if(playRecBtn) {
                            playRecBtn.disabled = false;
                            playRecBtn.onclick = () => {
                                const audio = new Audio(audioUrls[id]);
                                audio.play();
                            };
                        }
                    };

                    recorder.start();
                    mediaRecorders[id] = recorder;
                    btn.innerHTML = "⏹️";
                    btn.classList.add("recording");
                } catch (err) {
                    alert("Microphone access denied or not supported.");
                }
            } else {
                mediaRecorders[id].stop();
                btn.innerHTML = "🎤";
                btn.classList.remove("recording");
            }
        }

            let btnId = `play-btn-${counter}`;

                        subId: "sub-2-3",
                        title: "3. 原本...沒想到...",
                        note: "<b>Explanation:</b> 表示原來想的和實際發生的不一樣，覺得很驚訝。<br>Used to show that what actually happened was different from what was originally expected, expressing surprise.",
                        examples: [
                            { zh: "原(yuán)本(běn)今(jīn)天(tiān)是(shì)晴(qíng)天(tiān)，沒(méi)想(xiǎng)到(dào)突(tū)然(rán)下(xià)大(dà)雨(yǔ)了(le)。", en: "It was originally supposed to be sunny today, but I didn't expect it to suddenly rain heavily." }
                        ]
                    },
                    {
                        type: "grammar",
                        subId: "sub-2-4",
                        title: "4. 趁著 + (時間)",
                        note: "<b>Explanation:</b> 利用某個時間做某件事。<br>To take advantage of a particular time to do something.",
                        examples: [
                            { zh: "趁(chèn)著(zhe)今(jīn)天(tiān)是(shì)感(gǎn)恩(ēn)節(jié)，不(bù)用(yòng)上(shàng)課(kè)，我(wǒ)要(yào)做(zuò)很(hěn)多(duō)派(pài)。", en: "Since it's Thanksgiving today and I don't have class, I'm going to make a lot of pies." },
                            { zh: "趁(chèn)著(zhe)今(jīn)天(tiān)好(hǎo)天(tiān)氣(qì)，我(wǒ)要(yào)去(qù)外(wài)面(miàn)打(dǎ)球(qiú)。", en: "Since the weather is nice today, I'm going to go play ball outside." },
                            { zh: "趁(chèn)著(zhe)今(jīn)天(tiān)我(wǒ)的(de)父(fù)母(mǔ)都(dōu)不(bù)用(yòng)上(shàng)班(bān)，我(wǒ)們(men)一(yì)家(jiā)人(rén)要(yào)出(chū)去(qù)玩(wán)。", en: "Since my parents don't have to work today, our whole family is going out to have fun." }
                        ]
                    }
                ]
            },
            {
                title: "三、短文 (Reading Passage)",
                items: [
                    {
                        type: "reading",
                        subId: "sub-3-1",
                        title: "短文",
                        sentences: [
                            "阿(ā)哲(zhé)是(shì)一(yí)位(wèi)年(nián)輕(qīng)音(yīn)樂(yuè)家(jiā)，最(zuì)近(jìn)他(tā)一(yì)直(zhí)專(zhuān)注(zhù)在(zài)作(zuò)一(yì)首(shǒu)新(xīn)歌(gē)，這(zhè)首(shǒu)歌(gē)的(de)主(zhǔ)題(tí)是(shì)關(guān)於(yú)他(tā)小(xiǎo)時(shí)候(hòu)被(bèi)霸(bà)凌(líng)的(de)經(jīng)歷(lì)。",
                            "昨(zuó)天(tiān)，他(tā)收(shōu)到(dào)朋(péng)友(yǒu)寄(jì)來(lái)的(de)信(xìn)，邀(yāo)請(qǐng)他(tā)參(cān)加(jiā)一(yì)場(chǎng)辦(bàn)在(zài)涉(shè)谷(gǔ)大(dà)樓(lóu)頂(dǐng)樓(lóu)的(de)派(pài)對(duì)。",
                            "那(nà)裡(lǐ)有(yǒu)一(yì)間(jiān)酒(jiǔ)吧(bā)，門(mén)口(kǒu)已(yǐ)經(jīng)有(yǒu)很(hěn)多(duō)人(rén)在(zài)排(pái)隊(duì)。",
                            "阿(ā)哲(zhé)進(jìn)去(qù)後(hòu)，覺(jué)得(de)裡(lǐ)面(miàn)的(de)空(kōng)調(tiáo)太(tài)冷(lěng)，想(xiǎng)請(qǐng)服(fú)務(wù)生(shēng)幫(bāng)忙(máng)調(tiáo)整(zhěng)溫(wēn)度(dù)。",
                            "他(tā)坐(zuò)下(xià)來(lái)，想(xiǎng)趁(chèn)著(zhe)有(yǒu)空(kòng)的(de)時(shí)間(jiān)決(jué)定(dìng)新(xīn)歌(gē)的(de)主(zhǔ)題(tí)，卻(què)發(fā)現(xiàn)這(zhè)裡(lǐ)的(de)無(wú)線(xiàn)網(wǎng)路(lù)連(lián)不(bú)上(shàng)。",
                            "他(tā)有(yǒu)點(diǎn)煩(fán)，走(zǒu)到(dào)陽(yáng)台(tái)看(kàn)著(zhe)幾(jǐ)個(gè)人(rén)正(zhèng)在(zài)抽(chōu)菸(yān)。",
                            "吹(chuī)著(zhe)晚(wǎn)風(fēng)，他(tā)突(tū)然(rán)有(yǒu)了(le)靈(líng)感(gǎn)，決(jué)定(dìng)用(yòng)音(yīn)樂(yuè)放(fàng)下(xià)過(guò)去(qù)的(de)難(nán)過(guò)的(de)心(xīn)情(qíng)。"
                        ]
                    }
                ]
            }
        ];

        const container = document.getElementById('content');
        let counter = 0;

        lessonData.forEach((sec, sIdx) => {
            let html = `<div class="section" id="sec-${sIdx+1}"><h2>${sec.title}</h2>`;

            sec.items.forEach(item => {
                let anchorAttr = item.subId ? `id="${item.subId}"` : '';

                if (item.type === "vocabTable") {
                    html += `<div class="grammar-box" ${anchorAttr}>
                        <div style="font-weight:bold; font-size:17px; color:#8C6239; margin-bottom:8px;">${item.title}</div>
                        <table class="custom-table"><thead><tr>`;
                    item.tableHeaders.forEach(th => { html += `<th>${th}</th>`; });
                    html += `</tr></thead><tbody>`;
                    item.tableRows.forEach(row => {
                        let zhCell = row[0];
                        html += `<tr>
                            <td>
                                <div class="sentence-row" style="margin-bottom:0;">
                                    ${audioButtons(zhCell, counter)}
                                    <div style="font-size: 20px;">${parsePinyin(zhCell)}</div>
                                </div>
                            </td>
                            <td>${row[1]}</td>
                        </tr>`;
                        counter++;
                    });
                    html += `</tbody></table></div>`;

                } else if (item.type === "compare") {
                    html += `<div class="grammar-box" ${anchorAttr}>
                        <div style="font-weight:bold; font-size:17px; color:#8C6239; margin-bottom:8px;">${item.title}</div>
                        <div class="compare-wrap">`;
                    item.cols.forEach(col => {
                        html += `<div class="compare-col">
                            <div class="sentence-row" style="justify-content:center; margin-bottom:8px;">
                                ${audioButtons(col.zh, counter)}
                                <div style="font-size: 20px;">${parsePinyin(col.zh)}</div>
                            </div>
                            <img src="${col.image}" alt="${col.zh.replace(/\(.*?\)/g, '')}">
                            <div class="compare-note">
                                <div>${parsePinyin(col.noteZh)}</div>
                                <div class="en-trans">${col.noteEn}</div>
                            </div>
                        </div>`;
                        counter++;
                    });
                    html += `</div></div>`;

                } else if (item.type === "topicTable") {
                    html += `<div class="grammar-box" ${anchorAttr}>
                        <div style="font-weight:bold; font-size:17px; color:#8C6239; margin-bottom:8px;">${item.title}</div>
                        <table class="custom-table"><thead><tr>`;
                    item.tableHeaders.forEach(th => { html += `<th>${th}</th>`; });
                    html += `</tr></thead><tbody>`;
                    item.tableRows.forEach(row => {
                        html += `<tr>
                            <td>
                                <div class="sentence-row" style="margin-bottom:0;">
                                    ${audioButtons(row.zh, counter)}
                                    <div style="font-size: 20px;">${parsePinyin(row.zh)}</div>
                                </div>
                            </td>
                            <td>
                                <div>${parsePinyin(row.noteZh)}</div>
                                <div class="en-trans">${row.noteEn}</div>
                            </td>
                            <td>
                                <div class="sentence-row" style="margin-bottom:0;">
                                    ${audioButtons(row.ex, counter + 1)}
                                    <div style="font-size: 18px;">${parsePinyin(row.ex)}</div>
                                </div>
                            </td>
                        </tr>`;
                        counter += 2;
                    });
                    html += `</tbody></table></div>`;

                } else if (item.type === "grammar") {
                    html += `<div class="grammar-box" ${anchorAttr}>
                        <div style="font-weight:bold; font-size:17px; color:#8C6239; margin-bottom:8px;">${item.title}</div>`;
                    if(item.note) html += `<div class="note">${item.note}</div>`;
                    if(item.image) html += `<img src="${item.image}" class="lesson-img" alt="Lesson Image">`;

                    if (item.examples) {
                        item.examples.forEach(ex => {
                            html += `
                            <div class="item">
                                <div class="sentence-row">
                                    ${audioButtons(ex.zh, counter)}
                                    <div class="text-content">
                                        <div style="font-size:24px; margin-bottom:4px;">${parsePinyin(ex.zh)}</div>
                                        <div class="en-trans">${ex.en}</div>
                                        ${ex.noteEn ? `<div class="en-trans" style="color:#999;">${ex.noteEn}</div>` : ''}
                                    </div>
                                </div>
                            </div>`;
                            counter++;
                        });
                    }
                    html += `</div>`;

                } else if (item.type === "reading") {
                    html += `<div class="grammar-box" ${anchorAttr}>`;
                    item.sentences.forEach(s => {
                        html += `
                        <div class="item">
                            <div class="sentence-row">
                                ${audioButtons(s, counter)}
                                <div class="text-content">
                                    <div style="font-size:22px;">${parsePinyin(s)}</div>
                                </div>
                            </div>
                        </div>`;
                        counter++;
                    });
                    html += `</div>`;
                }
            });
            html += `</div>`;
            container.innerHTML += html;
        });

        let pinyinVisible = true;
        let enVisible = true;

        function togglePinyin() {
            pinyinVisible = !pinyinVisible;
            document.querySelectorAll('.py-text').forEach(el => {
                el.style.display = pinyinVisible ? 'block' : 'none';
            });
        }

        function toggleEnglish() {
            enVisible = !enVisible;
            document.querySelectorAll('.en-trans').forEach(el => {
                el.style.display = enVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
