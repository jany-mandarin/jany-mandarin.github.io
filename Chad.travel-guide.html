function zy(text) {
  return `<span class="zy-text">${text}</span>`;
}

function audioUnit(zhText, enText, extraClass, enClass) {
  enClass = enClass || 'en-trans';
  return `<div class="audio-unit ${extraClass||''}">
      <button class="audio-btn" onclick="playAudioText(this)">🔊</button>
      <div class="au-content">
        ${zy(zhText)}
        <span class="${enClass}">${enText}</span>
      </div>
    </div>`;
}

function render() {
  const tocList = document.getElementById('tocList');
  const container = document.getElementById('sections');
  let tocHtml = '';
  let html = '';

  sections.forEach(sec => {
    tocHtml += `<li><a href="#${sec.id}" onclick="closeSidebarOnMobile()">${sec.title}<span class="en">${sec.titleEn}</span></a></li>`;

    let dialogHtml = '';
    sec.dialogue.forEach(line => {
      if (line.note) {
        dialogHtml += `<div class="note-line">${line.note}</div>`;
        return;
      }
      const speakerEn = line.speakerEn ? ` <span class="en">(${line.speakerEn})</span>` : '';
      dialogHtml += `
        <div class="dialog-turn">
          <div class="speaker">${line.speaker}${speakerEn}：</div>
          ${audioUnit(line.zh, line.en)}
        </div>`;
    });

    let vocabHtml = `<div class="vocab-title">🔑 Key Vocabulary</div>
      <table class="vocab-table">
        <thead><tr><th>中文單字</th><th>中文例句</th></tr></thead>
        <tbody>`;
    sec.vocab.forEach(v => {
      const noteHtml = v.note ? `<div class="vocab-note">${v.note}</div>` : '';
      const wordCell = audioUnit(v.word, v.en, 'vocab-word-audio', 'vocab-en') + noteHtml;
      const exampleCell = v.ex_zh ? audioUnit(v.ex_zh, v.ex_en) : '<span style="color:#ccc;">—</span>';
      vocabHtml += `
        <tr>
          <td>${wordCell}</td>
          <td>${exampleCell}</td>
        </tr>`;
    });
    vocabHtml += '</tbody></table>';

    html += `
      <div class="section" id="${sec.id}">
        <h2>${sec.title} <span style="color:#999; font-size:15px; font-weight:normal;">${sec.titleEn}</span></h2>
        <div class="dialog-box">${dialogHtml}</div>
        ${vocabHtml}
      </div>`;
  });

  tocList.innerHTML = tocHtml;
  container.innerHTML = html;
  parseZhuyinDOM();
}

// ====== Parse Zhuyin on Load (DOM based) ======
function parseZhuyinDOM() {
  const regex = /([一-龥a-zA-Z0-9])\((.*?)\)/g;
  document.querySelectorAll('.zy-text').forEach(el => {
    let html = el.innerHTML;
    let parsed = html.replace(regex, (match, char, zyval) => {
      let tone = '';
      let symbols = zyval;
      let isNeutral = false;

      if (zyval.includes('ˊ')) { tone = 'ˊ'; symbols = zyval.replace('ˊ', ''); }
      else if (zyval.includes('ˇ')) { tone = 'ˇ'; symbols = zyval.replace('ˇ', ''); }
      else if (zyval.includes('ˋ')) { tone = 'ˋ'; symbols = zyval.replace('ˋ', ''); }
      else if (zyval.includes('˙')) { isNeutral = true; symbols = zyval.replace('˙', ''); }

      let toneHtml = tone ? `<span class="zy-tone">${tone}</span>` : '';
      let neutralHtml = isNeutral ? `<span class="zy-neutral">˙</span>` : '';

      return `<div class="zy-char-wrap"><span class="zy-char">${char}</span><div class="zy-box">${neutralHtml}<span class="zy-symbols">${symbols}</span>${toneHtml}</div></div>`;
    });
    el.innerHTML = parsed;
  });
}

// ====== Audio Reading (speaker labels are plain text, outside .audio-unit, so they are never read) ======
let currentUtteranceText = "";
function playAudioText(btn) {
  let container = btn.closest('.audio-unit');
  let zyDiv = container ? container.querySelector('.zy-text') : null;
  if (!zyDiv) return;

  let wraps = zyDiv.querySelectorAll('.zy-char-wrap');
  let cleanText = "";
  if (wraps.length > 0) {
    let strArr = [];
    wraps.forEach(w => {
      let charEl = w.querySelector('.zy-char');
      let symEl = w.querySelector('.zy-symbols');
      let toneEl = w.querySelector('.zy-tone');
      let neuEl = w.querySelector('.zy-neutral');
      if (!charEl) return;
      let ch = charEl.innerText;
      strArr.push(ch);
    });
    cleanText = strArr.join('');
  } else {
    cleanText = zyDiv.innerText.replace(/\(.*?\)/g, '');
  }

  cleanText = cleanText.replace(/\//g, ' ');

  if (speechSynthesis.speaking && currentUtteranceText === cleanText) {
    if (speechSynthesis.paused) { speechSynthesis.resume(); } else { speechSynthesis.pause(); }
    return;
  }

  speechSynthesis.cancel();
  currentUtteranceText = cleanText;
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'zh-TW';
  utterance.rate = 0.85;
  utterance.onend = () => { currentUtteranceText = ""; };
  speechSynthesis.speak(utterance);
}

let zyVisible = true;
let enVisible = false;
function toggleZhuyin() {
  zyVisible = !zyVisible;
  document.querySelectorAll('.zy-box').forEach(el => { el.style.display = zyVisible ? 'inline-flex' : 'none'; });
}
function toggleEnglish() {
  enVisible = !enVisible;
  document.querySelectorAll('.en-trans, .vocab-en, .vocab-note').forEach(el => {
    el.style.display = enVisible ? (el.classList.contains('vocab-en') ? 'inline' : 'block') : 'none';
  });
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const mainContent = document.getElementById('mainContent');
  if (window.innerWidth <= 900) {
    sidebar.classList.toggle('active');
  } else {
    sidebar.classList.toggle('collapsed');
    mainContent.classList.toggle('expanded');
  }
}
function closeSidebarOnMobile() {
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.remove('active');
  }
}

document.addEventListener("DOMContentLoaded", render);
