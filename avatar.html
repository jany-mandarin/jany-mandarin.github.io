<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Mandarin Village - Character Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fefae0;
            background-image: radial-gradient(#faedcd 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .oops-card {
            background: #fffdf5;
            border: 3px solid #ffb703;
            box-shadow: 6px 6px 0px #fb8500;
        }
        .oops-btn {
            background-color: #fb8500;
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
        }
        .oops-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fb8500;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-slate-800 p-4">

    <!-- 主容器：左右雙欄大卡片 -->
    <div class="oops-card rounded-3xl max-w-4xl w-full grid grid-cols-1 md:grid-cols-12 overflow-hidden shadow-2xl">
        
        <!-- ================= LEFT COLUMN: 設定控制面板 (7欄) ================= -->
        <div class="md:col-span-7 p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r-2 border-amber-200 max-h-[85vh] overflow-y-auto custom-scrollbar">
            <div>
                <div class="mb-6">
                    <span class="bg-[#ffb703] text-slate-900 font-black text-xs uppercase tracking-widest px-3 py-1 rounded-full border-2 border-black inline-block mb-2">
                        Character Studio
                    </span>
                    <h1 class="text-2xl font-black text-slate-900">Customize Your Avatar</h1>
                    <p class="text-xs text-slate-600 mt-1 font-medium">Design your look for the Mandarin Village community.</p>
                </div>

                <!-- 控制選項 -->
                <div class="space-y-4 text-left">
                    <!-- 膚色選擇 -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Skin Tone</label>
                        <div class="flex gap-3">
                            <button onclick="setSkin('#fed7aa', this)" class="skin-btn w-8 h-8 rounded-full bg-[#fed7aa] border-2 border-black ring-2 ring-[#fb8500] transition hover:scale-110 shadow-[2px_2px_0px_#000]"></button>
                            <button onclick="setSkin('#fcd34d', this)" class="skin-btn w-8 h-8 rounded-full bg-[#fcd34d] border-2 border-black transition hover:scale-110 shadow-[2px_2px_0px_#000]"></button>
                            <button onclick="setSkin('#d97706', this)" class="skin-btn w-8 h-8 rounded-full bg-[#d97706] border-2 border-black transition hover:scale-110 shadow-[2px_2px_0px_#000]"></button>
                        </div>
                    </div>

                    <!-- 髮型選擇 -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Hair Style</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setHair('short', 'Short Bob')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Short Hair</button>
                            <button onclick="setHair('long', 'Long Flow')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Long Hair</button>
                            <button onclick="setHair('curly', 'Curly')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Curly</button>
                        </div>
                    </div>

                    <!-- 衣服造型 (短袖、帽T、裙子) -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Outfit (Top & Bottom)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setOutfit('bg-[#fb8500]', 'bg-slate-800', 'Short Tee')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Short Tee</button>
                            <button onclick="setOutfit('bg-[#219ebc]', 'bg-[#023047]', 'Cozy Hoodie')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Hoodie</button>
                            <button onclick="setOutfit('bg-rose-500', 'bg-rose-950', 'Skirt Set')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Skirt Set</button>
                        </div>
                    </div>

                    <!-- 鞋子 -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Shoes</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setShoes('bg-slate-900', 'Sneakers')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Sneakers</button>
                            <button onclick="setShoes('bg-amber-900', 'Boots')" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">Boots</button>
                        </div>
                    </div>

                    <!-- 現代配件 (眼鏡、耳環、圍巾) -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Accessories</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="toggleAccessory('glasses')" id="btn-glasses" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">👓 Glasses</button>
                            <button onclick="toggleAccessory('earrings')" id="btn-earrings" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">✨ Earrings</button>
                            <button onclick="toggleAccessory('scarf')" id="btn-scarf" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-amber-100 shadow-[2px_2px_0px_#000] transition">🧣 Scarf</button>
                            <button onclick="clearAccessories()" class="p-2 text-xs font-bold rounded-xl bg-white border-2 border-black hover:bg-red-100 text-red-600 shadow-[2px_2px_0px_#000] transition">✕ None</button>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="saveAndEnterWorld()" class="oops-btn w-full mt-6 text-white font-black py-3.5 rounded-xl text-base tracking-widest">
                ENTER VILLAGE 🚀
            </button>
        </div>

        <!-- ================= RIGHT COLUMN: 即時預覽展示台 (5欄) ================= -->
        <div class="md:col-span-5 p-6 md:p-8 flex flex-col items-center justify-center bg-amber-50/50 relative">
            
            <div class="absolute top-4 right-4 text-[10px] font-black uppercase tracking-widest bg-amber-200 px-2.5 py-1 rounded-full border border-black">
                Live Preview
            </div>

            <!-- 立體公仔展示台 -->
            <div class="w-56 h-72 rounded-3xl bg-white border-3 border-black shadow-[4px_4px_0px_#000] flex flex-col items-center justify-center relative p-4">
                
                <!-- 地面陰影 -->
                <div class="absolute bottom-6 w-32 h-4 bg-black/10 rounded-full blur-sm"></div>

                <!-- Q版立體人偶本體 -->
                <div class="relative flex flex-col items-center">
                    
                    <!-- 配件：眼鏡 -->
                    <div id="acc-glasses" class="absolute top-7 z-30 hidden text-sm">👓</div>
                    
                    <!-- 配件：耳環 -->
                    <div id="acc-earrings" class="absolute top-11 z-20 hidden flex justify-between w-18 px-0.5">
                        <span class="text-[10px]">💎</span>
                        <span class="text-[10px]">💎</span>
                    </div>

                    <!-- 頭髮 -->
                    <div id="avatar-hair" class="w-18 h-8 bg-amber-950 rounded-t-2xl z-20 mb-[-4px] border-2 border-black shadow-sm transition-all"></div>

                    <!-- 頭部 -->
                    <div id="avatar-head" class="w-14 h-14 rounded-full bg-[#fed7aa] border-2 border-black shadow-inner relative z-10 flex items-center justify-center transition-all">
                        <div class="flex space-x-2.5 items-center">
                            <div class="w-1.5 h-1.5 bg-black rounded-full"></div>
                            <div class="w-1.5 h-1.5 bg-black rounded-full"></div>
                        </div>
                        <div class="absolute bottom-1.5 flex space-x-4 opacity-40">
                            <div class="w-1.5 h-0.5 bg-pink-500 rounded-full"></div>
                            <div class="w-1.5 h-0.5 bg-pink-500 rounded-full"></div>
                        </div>
                    </div>

                    <!-- 配件：圍巾 -->
                    <div id="acc-scarf" class="absolute top-20 z-20 hidden w-20 h-3 bg-rose-500 rounded-full border border-black shadow-sm"></div>

                    <!-- 衣服本體 -->
                    <div id="avatar-body" class="w-18 h-16 bg-[#fb8500] rounded-2xl mt-[-8px] border-2 border-black relative z-0 flex items-center justify-center transition-all shadow-sm">
                        <div class="w-6 h-1 bg-white/40 rounded-full"></div>
                    </div>

                    <!-- 褲子／裙子 -->
                    <div id="avatar-bottom" class="w-16 h-6 bg-slate-800 rounded-b-xl mt-[-2px] border-2 border-t-0 border-black z-0 flex justify-around items-center px-2 transition-all">
                        <div class="w-2.5 h-3 bg-black rounded-sm"></div>
                        <div class="w-2.5 h-3 bg-black rounded-sm"></div>
                    </div>

                    <!-- 鞋子 -->
                    <div class="flex space-x-3 mt-[-2px]">
                        <div id="shoe-left" class="w-4 h-2.5 bg-slate-900 rounded-full border border-black"></div>
                        <div id="shoe-right" class="w-4 h-2.5 bg-slate-900 rounded-full border border-black"></div>
                    </div>
                </div>

                <!-- 玩家名稱與國家即時顯示 -->
                <div class="mt-4 text-center z-30">
                    <div id="display-name" class="font-black text-slate-900 text-sm">Traveler</div>
                    <div id="display-country" class="text-[11px] text-slate-600 font-bold">🇺🇸 United States</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 從第一頁讀取剛剛填寫的名字和國家
        const playerName = localStorage.getItem('village_username') || 'Traveler';
        const playerCountry = localStorage.getItem('village_country') || '🇺🇸 United States';

        document.getElementById('display-name').innerText = playerName;
        document.getElementById('display-country').innerText = playerCountry;

        // 狀態物件
        let avatarState = {
            skin: '#fed7aa',
            hair: 'short',
            topColor: 'bg-[#fb8500]',
            bottomColor: 'bg-slate-800',
            shoeColor: 'bg-slate-900',
            accessories: { glasses: false, earrings: false, scarf: false }
        };

        function setSkin(color, btn) {
            avatarState.skin = color;
            document.getElementById('avatar-head').style.backgroundColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('ring-2', 'ring-[#fb8500]'));
            btn.classList.add('ring-2', 'ring-[#fb8500]');
        }

        function setHair(type, name) {
            avatarState.hair = type;
            const hairEl = document.getElementById('avatar-hair');
            if(type === 'short') {
                hairEl.className = "w-18 h-8 bg-amber-950 rounded-t-2xl z-20 mb-[-4px] border-2 border-black shadow-sm transition-all";
            } else if(type === 'long') {
                hairEl.className = "w-18 h-12 bg-amber-950 rounded-t-3xl z-20 mb-[-4px] border-2 border-black shadow-sm transition-all";
            } else if(type === 'curly') {
                hairEl.className = "w-20 h-10 bg-amber-950 rounded-full z-20 mb-[-6px] border-2 border-black shadow-sm transition-all";
            }
        }

        function setOutfit(topClass, bottomClass, name) {
            avatarState.topColor = topClass;
            avatarState.bottomColor = bottomClass;
            
            const bodyEl = document.getElementById('avatar-body');
            bodyEl.className = `w-18 h-16 rounded-2xl mt-[-8px] border-2 border-black relative z-0 flex items-center justify-center transition-all shadow-sm ${topClass}`;
            
            const bottomEl = document.getElementById('avatar-bottom');
            bottomEl.className = `w-16 h-6 rounded-b-xl mt-[-2px] border-2 border-t-0 border-black z-0 flex justify-around items-center px-2 transition-all ${bottomClass}`;
        }

        function setShoes(colorClass, name) {
            avatarState.shoeColor = colorClass;
            document.getElementById('shoe-left').className = `w-4 h-2.5 rounded-full border border-black transition-all ${colorClass}`;
            document.getElementById('shoe-right').className = `w-4 h-2.5 rounded-full border border-black transition-all ${colorClass}`;
        }

        function toggleAccessory(type) {
            avatarState.accessories[type] = !avatarState.accessories[type];
            const el = document.getElementById(`acc-${type}`);
            const btn = document.getElementById(`btn-${type}`);
            
            if(avatarState.accessories[type]) {
                el.classList.remove('hidden');
                btn.classList.add('bg-amber-200');
            } else {
                el.classList.add('hidden');
                btn.classList.remove('bg-amber-200');
            }
        }

        function clearAccessories() {
            avatarState.accessories = { glasses: false, earrings: false, scarf: false };
            ['glasses', 'earrings', 'scarf'].forEach(type => {
                document.getElementById(`acc-${type}`).classList.add('hidden');
                document.getElementById(`btn-${type}`).classList.remove('bg-amber-200');
            });
        }

        function saveAndEnterWorld() {
            // 把外觀設定儲存到 localStorage，這樣地圖或其他人就能讀取到這個人的外觀！
            localStorage.setItem('village_avatar', JSON.stringify(avatarState));
            
            alert(`Awesome! Your character has been created. Ready to enter the Mandarin Village map! 🍊`);
            // 接下來這裡可以跳轉到地圖頁面 (例如 window.location.href = 'map.html';)
        }
    </script>
</body>
</html>
