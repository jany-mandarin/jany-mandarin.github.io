        function parseZhuyin(text) {
            const regex = /([\u4e00-\u9fa5a-zA-Z0-9])\((.*?)\)/g;
            let parsed = text.replace(regex, (match, char, zy) => {
                let tone = '';
                let symbols = zy;
                let isNeutral = false;
                
                if (zy.includes('ˊ')) { tone = 'ˊ'; symbols = zy.replace('ˊ', ''); }
                else if (zy.includes('ˇ')) { tone = 'ˇ'; symbols = zy.replace('ˇ', ''); }
                else if (zy.includes('ˋ')) { tone = 'ˋ'; symbols = zy.replace('ˋ', ''); }
                else if (zy.includes('˙')) { isNeutral = true; symbols = zy.replace('˙', ''); }

                let toneHtml = tone ? `<span class="zy-tone">${tone}</span>` : '';
                let neutralHtml = isNeutral ? `<span class="zy-neutral">˙</span>` : '';

                return `<div class="zy-char-wrap"><span class="zy-char">${char}</span><div class="zy-box">${neutralHtml}<span class="zy-symbols">${symbols}</span>${toneHtml}</div></div>`;
            });
            return parsed;
        }

                note: "'我覺得很痛' refers to literal physical pain. If you just feel sick or unwell, say '我現在不太好'.",
                wrong: "我(ㄨㄛˇ)覺(ㄐㄩㄝˊ)得(ㄉㄜ˙)很(ㄏㄣˇ)痛(ㄊㄨㄥˋ)",
                correct: "我(ㄨㄛˇ)現(ㄒㄧㄢˋ)在(ㄗㄞˋ)不(ㄅㄨˊ)太(ㄊㄞˋ)好(ㄏㄠˇ)",
                en: "I don't feel well right now."
            },
            {
                title: "Eat well vs. Eat more rice",
                note: "To say 'drink water and eat well', don't translate literally. Say 'drink more water and eat more rice/healthy food'.",
                wrong: "你(ㄋㄧˇ)今(ㄐㄧㄣ)天(ㄊㄧㄢ)要(ㄧㄠˋ)多(ㄉㄨㄛ)喝(ㄏㄜ)水(ㄕㄨㄟˇ)跟(ㄍㄣ)吃(ㄔ)非(ㄈㄟ)常(ㄔㄤˊ)好(ㄏㄠˇ)的(ㄉㄜ˙)食(ㄕˊ)物(ㄨˋ)",
                correct: "你(ㄋㄧˇ)要(ㄧㄠˋ)多(ㄉㄨㄛ)喝(ㄏㄜ)水(ㄕㄨㄟˇ)跟(ㄍㄣ)多(ㄉㄨㄛ)吃(ㄔ)飯(ㄈㄢˋ)",
                en: "You need to drink water and eat well today."
            },
            {
                title: "Awesome",
                note: "'Awesome' is more naturally translated as '太棒了', not '非常好' (very good).",
                wrong: "非(ㄈㄟ)常(ㄔㄤˊ)好(ㄏㄠˇ)",
                correct: "太(ㄊㄞˋ)棒(ㄅㄤˋ)了(ㄌㄜ˙)",
                en: "Awesome!"
            },
            {
                title: "Let's do something",
                note: "'讓' (let) requires a subject (A lets B do something). For 'Let's...', use '我們一起去...'.",
                wrong: "讓(ㄖㄤˋ)我(ㄨㄛˇ)們(ㄇㄣ˙)多(ㄉㄨㄛ)吃(ㄔ)超(ㄔㄠ)好(ㄏㄠˇ)吃(ㄔ)的(ㄉㄜ˙)食(ㄕˊ)物(ㄨˋ)吧(ㄅㄚ˙)",
                correct: "我(ㄨㄛˇ)們(ㄇㄣ˙)一(ㄧˋ)起(ㄑㄧˇ)去(ㄑㄩˋ)吃(ㄔ)超(ㄔㄠ)好(ㄏㄠˇ)吃(ㄔ)的(ㄉㄜ˙)食(ㄕˊ)物(ㄨˋ)吧(ㄅㄚ˙)",
                en: "Let's get some delicious food!"
            }
        ];

        const container = document.getElementById('content');
        
        data.forEach(sec => {
            let html = `<div class="section"><h2>${sec.title}</h2>`;
            if(sec.note) html += `<p class="note">${sec.note}</p>`;
            
            sec.items.forEach(item => {
                html += `
                    <div class="item">
                        <div class="item-content">
                            <button class="audio-btn" onclick="playAudio('${item.zh}')">🔊</button>
                            <div class="zhuyin-content">${parseZhuyin(item.zh)}</div>
                        </div>
                        <div class="en-trans">${item.en}</div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML += html;
        });

        let ruleHtml = `<div class="section"><h2>⚖️ Authentic Expressions (❌ vs ✅)</h2>`;
        rules.forEach(rule => {
            ruleHtml += `
                <div class="grammar-box">
                    <div style="font-weight:bold; margin-bottom: 5px;">${rule.title}</div>
                    <div class="note">${rule.note}</div>
                    <div class="item-content" style="margin-top: 15px; align-items:center;">
                        <button class="audio-btn" style="width:30px;height:30px;font-size:14px;margin-right:15px;" onclick="playAudio('${rule.wrong}')">🔊</button>
                        <span class="wrong">❌ </span> <span style="margin-left:8px;">${parseZhuyin(rule.wrong)}</span>
                    </div>
                    <div class="item-content" style="margin-top: 15px; align-items:center;">
                        <button class="audio-btn" style="width:30px;height:30px;font-size:14px;margin-right:15px;" onclick="playAudio('${rule.correct}')">🔊</button>
                        <span class="correct">✅ </span> <span style="margin-left:8px;">${parseZhuyin(rule.correct)}</span>
                    </div>
                    <div class="en-trans" style="margin-left:45px; margin-top:10px;">${rule.en}</div>
                </div>
            `;
        });
        ruleHtml += `</div>`;
        container.innerHTML += ruleHtml;

        // Homework Section
        let hwHtml = `
            <div class="section">
                <h2>📝 Homework: Reading Comprehension</h2>
                <div class="homework">
                    <p>前天禮拜五是中秋節，大家都放假，回家跟家人在一起烤肉和吃月餅，路上的烤肉味很香，全台灣天氣都很好。王陽明住在一個大樓，大樓不可以烤肉，所以他跟家人一起去烤肉店，可是每家烤肉店裡都有非常多人，他們找不到位子，他很難過，去了五家烤肉店、開了兩個鐘頭的車後，終於找到一家有位子，那一刻大家開心地坐下來，一起吃烤肉看月亮，過中秋節。</p>
                    
                    <div class="homework-q">Q1. 中秋節的時候，全台灣人會做什麼事?</div>
                    <textarea style="width:100%; height:40px; margin-top:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc; padding: 5px;"></textarea>

                    <div class="homework-q">Q2. 王陽明一開始為什麼很難過?</div>
                    <textarea style="width:100%; height:40px; margin-top:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc; padding: 5px;"></textarea>

                    <div class="homework-q">Q3. 王陽明花了多久找到烤肉店?</div>
                    <textarea style="width:100%; height:40px; margin-top:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc; padding: 5px;"></textarea>

                    <div class="homework-q">Q4. 王陽明最後怎麼了?</div>
                    <textarea style="width:100%; height:40px; margin-top:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc; padding: 5px;"></textarea>
                </div>
            </div>
        `;
        container.innerHTML += hwHtml;

        let zyVisible = true;
        let enVisible = true;

        function toggleZhuyin() {
            zyVisible = !zyVisible;
            document.querySelectorAll('.zy-box').forEach(el => {
                el.style.display = zyVisible ? 'inline-flex' : 'none';
            });
        }

        function toggleEnglish() {
            enVisible = !enVisible;
            document.querySelectorAll('.en-trans').forEach(el => {
                el.style.display = enVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
