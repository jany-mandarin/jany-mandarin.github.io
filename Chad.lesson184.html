        @keyframes pulse {

            50% { opacity: 0.5; }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');

                sidebar.classList.toggle('collapsed');

        function parseZhuyin(text) {
            const regex = /([\u4e00-\u9fa5a-zA-Z0-9])\((.*?)\)/g;
            let parsed = text.replace(regex, (match, char, zy) => {
                let tone = '';
                let symbols = zy;
                let isNeutral = false;
                
                if (zy.includes('ˊ')) { tone = 'ˊ'; symbols = zy.replace('ˊ', ''); }
                else if (zy.includes('ˇ')) { tone = 'ˇ'; symbols = zy.replace('ˇ', ''); }
                else if (zy.includes('ˋ')) { tone = 'ˋ'; symbols = zy.replace('ˋ', ''); }
                else if (zy.includes('˙')) { isNeutral = true; symbols = zy.replace('˙', ''); }

                let toneHtml = tone ? `<span class="zy-tone">${tone}</span>` : '';
                let neutralHtml = isNeutral ? `<span class="zy-neutral">˙</span>` : '';

                return `<div class="zy-char-wrap"><span class="zy-char">${char}</span><div class="zy-box">${neutralHtml}<span class="zy-symbols">${symbols}</span>${toneHtml}</div></div>`;
            });
            return parsed;
        }

        function playAudio(text) {
            // Regex allows Chinese, English letters, spaces, and basic punctuation
            // Forces '和' to '汗', '都' to '兜' (dōu), and '差' to '插' (chā) for correct Taiwan TTS
            let cleanText = text.replace(/\(.*?\)/g, '')
                                .replace(/和/g, '汗') 
                                .replace(/都/g, '兜') 
                                .replace(/差/g, '插') 
                                .replace(/[^\u4e00-\u9fa5，。？！a-zA-Z ]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85;
            speechSynthesis.speak(utterance);
        }

        let mediaRecorders = {};
        let audioChunks = {};
        let audioUrls = {};

        async function toggleRecord(btn, id) {
            if (!mediaRecorders[id] || mediaRecorders[id].state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let chunks = [];
                    let recorder = new MediaRecorder(stream);
                    
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { 'type': 'audio/ogg; codecs=opus' });
                        audioUrls[id] = URL.createObjectURL(blob);
                        document.getElementById(`play-rec-${id}`).disabled = false;
                    };

                    recorder.start();
                    mediaRecorders[id] = recorder;
                    btn.innerText = "🛑 Stop";
                    btn.classList.add("recording");
                } catch (err) {
                    alert("Microphone access denied or not supported.");
                }
            } else {
                mediaRecorders[id].stop();
                btn.innerText = "🎤 Record";
                btn.classList.remove("recording");
            }
        }

        function playRecording(id) {
            if (audioUrls[id]) {
                const audio = new Audio(audioUrls[id]);

            }
