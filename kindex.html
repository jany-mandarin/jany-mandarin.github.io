<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Mandarin Village - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 溫暖奶黃色系背景與 Oops 風格點陣 */
        body {
            background-color: #fefae0;
            background-image: radial-gradient(#faedcd 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .oops-card {
            background: #fffdf5;
            border: 3px solid #ffb703;
            box-shadow: 6px 6px 0px #fb8500;
        }
        .oops-btn {
            background-color: #fb8500;
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
        }
        .oops-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }
        .oops-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000000;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-slate-800 p-4">

    <!-- 歡迎卡片容器 -->
    <div class="oops-card rounded-3xl p-8 max-w-md w-full mx-4 text-center">
        
        <!-- 品牌標題與簡短歡迎詞 -->
        <div class="mb-6">
            <span class="bg-[#ffb703] text-slate-900 font-black text-xs uppercase tracking-widest px-3 py-1 rounded-full border-2 border-black inline-block mb-3 shadow-[2px_2px_0px_#000]">
                Oops! Mandarin
            </span>
            <h1 class="text-3xl font-black text-[#fb8500] tracking-wide drop-shadow-[2px_2px_0px_#fff] leading-tight">
                歡迎大家加入<br><span class="text-slate-900">中文學習村</span>
            </h1>
            <p class="text-sm text-slate-600 mt-2 font-medium">
                Welcome to Mandarin Village 🍊
            </p>
        </div>

        <!-- 表單輸入區 -->
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Your Name / Nickname</label>
                <input type="text" id="username" placeholder="e.g. Jany or Patrick" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-900 focus:outline-none focus:ring-2 focus:ring-[#fb8500] text-sm font-medium shadow-[2px_2px_0px_#000]">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Where do you live?</label>
                <select id="country-select" onchange="checkOtherCountry()" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-900 focus:outline-none focus:ring-2 focus:ring-[#fb8500] text-sm font-medium shadow-[2px_2px_0px_#000]">
                    <option value="🇹🇼 Taiwan">🇹🇼 Taiwan (台灣)</option>
                    <option value="🇳🇿 New Zealand">🇳🇿 New Zealand (紐西蘭)</option>
                    <option value="🇺🇸 United States">🇺🇸 United States (美國)</option>
                    <option value="🇵🇭 Philippines">🇵🇭 Philippines (菲律賓)</option>
                    <option value="🇮🇩 Indonesia">🇮🇩 Indonesia (印尼)</option>
                    <option value="🇲🇾 Malaysia">🇲🇾 Malaysia (馬來西亞)</option>
                    <option value="🇫🇷 France">🇫🇷 France (法國)</option>
                    <option value="🇬🇧 United Kingdom">🇬🇧 United Kingdom (英國)</option>
                    <option value="🇦🇺 Australia">🇦🇺 Australia (澳洲)</option>
                    <option value="other">✏️ Other (自訂國家)</option>
                </select>

                <!-- 當選擇 Other 時自動出現的自訂輸入框 -->
                <div id="other-country-container" class="mt-2 hidden">
                    <input type="text" id="custom-country" placeholder="Please type your country..." class="w-full px-4 py-2.5 rounded-xl bg-white border-2 border-slate-900 focus:outline-none focus:ring-2 focus:ring-[#fb8500] text-sm font-medium shadow-[2px_2px_0px_#000]">
                </div>
            </div>

            <!-- Enter 按鈕 -->
            <button onclick="goToAvatarCustomizer()" class="oops-btn w-full mt-6 text-white font-black py-3.5 rounded-xl text-lg tracking-widest">
                ENTER
            </button>
        </div>

    </div>

    <script>
        // 控制當選擇 "Other" 時顯示自訂輸入框
        function checkOtherCountry() {
            const select = document.getElementById('country-select');
            const otherContainer = document.getElementById('other-country-container');
            if (select.value === 'other') {
                otherContainer.classList.remove('hidden');
            } else {
                otherContainer.classList.add('hidden');
            }
        }

        function goToAvatarCustomizer() {
            const name = document.getElementById('username').value.trim();
            const selectValue = document.getElementById('country-select').value;
            let country = selectValue;

            if(!name) {
                alert('Please enter your name or nickname first!');
                return;
            }

            // 如果選的是自訂國家，就抓自訂輸入框的值
            if (selectValue === 'other') {
                const customCountry = document.getElementById('custom-country').value.trim();
                if (!customCountry) {
                    alert('Please type your country name!');
                    return;
                }
                country = customCountry;
            }

            // 儲存資料，準備帶到下一頁外觀設定
            localStorage.setItem('village_username', name);
            localStorage.setItem('village_country', country);

            alert(`Welcome, ${name} from ${country}! Next, let's design your avatar.`);
            // 接下來這裡會進入外觀設定頁面
        }
    </script>
</body>
</html>
