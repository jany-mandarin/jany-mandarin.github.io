<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Mandarin 虛擬村莊</title>
    <!-- 引入 Tailwind CSS 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 min-h-screen flex items-center justify-center font-sans">

    <!-- 主容器：精緻的玻璃擬態卡片 -->
    <div class="bg-white/80 backdrop-md p-8 rounded-3xl shadow-xl max-w-md w-full mx-4 border border-white/40">
        
        <!-- 標題區 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-teal-800">🌱 Oops! Mandarin 村莊</h1>
            <p class="text-sm text-gray-500 mt-1">建立你的角色，進入全球中文學習者的互動世界</p>
        </div>

        <!-- 表單與設定區 -->
        <div class="space-y-4">
            <!-- 輸入名字 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">你的名字或綽號</label>
                <input type="text" id="username" placeholder="例如：Jany 或 學習小幫手" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white/50">
            </div>

            <!-- 選擇國籍 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">來自哪個國家／地區</label>
                <select id="country" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white/50">
                    <option value="🇹🇼 台灣 (Taiwan)">🇹🇼 台灣 (Taiwan)</option>
                    <option value="🇫🇷 法國 (France)">🇫🇷 法國 (France)</option>
                    <option value="🇳🇿 紐西蘭 (New Zealand)">🇳🇿 紐西蘭 (New Zealand)</option>
                    <option value="🇺🇸 美國 (USA)">🇺🇸 美國 (USA)</option>
                    <option value="🌐 其他地區">🌐 其他地區</option>
                </select>
            </div>

            <!-- 選擇外觀造型（簡單示意） -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">選擇帽子配件</label>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <button type="button" class="p-2 border rounded-xl hover:border-teal-500 focus:border-teal-500 focus:bg-teal-50 text-xs font-medium">🧢 鴨舌帽</button>
                    <button type="button" class="p-2 border rounded-xl hover:border-teal-500 focus:border-teal-500 focus:bg-teal-50 text-xs font-medium">👒 登山帽</button>
                    <button type="button" class="p-2 border rounded-xl hover:border-teal-500 focus:border-teal-500 focus:bg-teal-50 text-xs font-medium">👓 鏡框</button>
                    <button type="button" class="p-2 border rounded-xl hover:border-teal-500 focus:border-teal-500 focus:bg-teal-50 text-xs font-medium">✨ 無配件</button>
                </div>
            </div>

            <!-- 進入按鈕 -->
            <button onclick="enterWorld()" class="w-full mt-6 bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-teal-600/25">
                進入世界地圖 🚀
            </button>
        </div>

    </div>

    <script>
        function enterWorld() {
            const name = document.getElementById('username').value;
            if(!name) {
                alert('請先輸入你的名字或綽號唷！');
                return;
            }
            alert(`歡迎來到村莊，${name}！接下來我們準備把地圖展開～`);
        }
    </script>
</body>
</html>
