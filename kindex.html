<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Mandarin 虛擬村莊 - 角色創造</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-50 to-teal-100 min-h-screen flex items-center justify-center font-sans">

    <!-- 主容器 -->
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl max-w-lg w-full mx-4 border border-white/50">
        
        <!-- 標題區 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-teal-800">🌱 Oops! Mandarin 虛擬村莊</h1>
            <p class="text-sm text-gray-500 mt-1">打造你的專屬角色，加入全球中文學習者的世界！</p>
        </div>

        <!-- 步驟 1：基本資料 -->
        <div id="step-1" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">你的名字或綽號</label>
                <input type="text" id="username" placeholder="例如：Jany" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">來自哪個國家／地區</label>
                <select id="country" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white/50">
                    <option value="🇹🇼 台灣">🇹🇼 台灣 (Taiwan)</option>
                    <option value="🇫🇷 法國">🇫🇷 法國 (France)</option>
                    <option value="🇳🇿 紐西蘭">🇳🇿 紐西蘭 (New Zealand)</option>
                    <option value="🇺🇸 美國">🇺🇸 美國 (USA)</option>
                    <option value="🌐 其他">🌐 其他國家</option>
                </select>
            </div>

            <button onclick="goToStep2()" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-teal-600/25">
                下一步：設計你的外觀 🎨
            </button>
        </div>

        <!-- 步驟 2：外觀客製化（捏臉換裝） -->
        <div id="step-2" class="space-y-4 hidden">
            <!-- 角色預覽框（模擬 3D 公仔感） -->
            <div class="bg-teal-50 rounded-2xl p-6 text-center border border-teal-100 flex flex-col items-center justify-center relative">
                <div class="w-24 h-24 rounded-full bg-amber-100 border-4 border-white shadow-md flex items-center justify-center text-4xl mb-2 transition-all" id="avatar-preview">
                    🧑
                </div>
                <div class="font-bold text-teal-900" id="preview-name">名字</div>
                <div class="text-xs text-teal-600" id="preview-country">國家</div>
            </div>

            <!-- 頭髮選項 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">選擇髮型／帽子</label>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <button type="button" onclick="setAccessory('帽', '🧢')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">🧢 圓帽</button>
                    <button type="button" onclick="setAccessory('長', '👧')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">👧 長髮</button>
                    <button type="button" onclick="setAccessory('短', '👦')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">👦 短髮</button>
                    <button type="button" onclick="setAccessory('無', '🧑')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">✨ 俐落</button>
                </div>
            </div>

            <!-- 服裝風格選項 -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">選擇服裝風格</label>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <button type="button" onclick="setOutfit('日常服', '👕')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">👕 日常休閒</button>
                    <button type="button" onclick="setOutfit('傳統服', '👘')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">👘 特色服飾</button>
                    <button type="button" onclick="setOutfit('連帽衣', '🧥')" class="p-2 border rounded-xl hover:border-teal-500 focus:bg-teal-50 text-xs">🧥 溫暖針織</button>
                </div>
            </div>

            <div class="flex space-x-2 mt-4">
                <button onclick="goBackToStep1()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-xl transition">
                    上一步
                </button>
                <button onclick="enterWorld()" class="w-2/3 bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl
