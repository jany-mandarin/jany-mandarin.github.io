<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Mandarin Village - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 溫暖奶黃色系背景與 Oops 風格邊框 */
        body {
            background-color: #fefae0;
            background-image: radial-gradient(#faedcd 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .oops-card {
            background: #fffdf5;
            border: 3px solid #ffb703;
            box-shadow: 6px 6px 0px #fb8500;
        }
        .oops-btn {
            background-color: #fb8500;
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
        }
        .oops-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }
        .oops-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000000;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-slate-800 p-4">

    <!-- 歡迎卡片容器 -->
    <div class="oops-card rounded-3xl p-8 max-w-md w-full mx-4 text-center">
        
        <!-- 品牌標題裝飾 -->
        <div class="mb-6">
            <span class="bg-[#ffb703] text-slate-900 font-black text-xs uppercase tracking-widest px-3 py-1 rounded-full border-2 border-black inline-block mb-3 shadow-[2px_2px_0px_#000]">
                Oops! Mandarin Community
            </span>
            <h1 class="text-3xl font-black text-[#fb8500] tracking-wide drop-shadow-[2px_2px_0px_#fff]">
                WELCOME TO <br><span class="text-slate-900">MANDARIN VILLAGE</span>
            </h1>
            <p class="text-sm text-slate-600 mt-2 font-medium">
                Join our global learners, explore the virtual map, and practice Chinese together!
            </p>
        </div>

        <!-- 表單輸入區 -->
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Your Name / Nickname</label>
                <input type="text" id="username" placeholder="e.g. Jany or Patrick" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-900 focus:outline-none focus:ring-2 focus:ring-[#fb8500] text-sm font-medium shadow-[2px_2px_0px_#000]">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Where do you live?</label>
                <select id="country" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-900 focus:outline-none focus:ring-2 focus:ring-[#fb8500] text-sm font-medium shadow-[2px_2px_0px_#000]">
                    <option value="🇹🇼 Taiwan">🇹🇼 Taiwan</option>
                    <option value="🇳🇿 New Zealand">🇳🇿 New Zealand</option>
                    <option value="🇺🇸 United States">🇺🇸 United States</option>
                    <option value="🇵🇭 Philippines">🇵🇭 Philippines</option>
                    <option value="🇮🇩 Indonesia">🇮🇩 Indonesia</option>
                    <option value="🇲🇾 Malaysia">🇲🇾 Malaysia</option>
                    <option value="🇫🇷 France">🇫🇷 France</option>
                    <option value="🇬🇧 United Kingdom">🇬🇧 United Kingdom</option>
                    <option value="🇦🇺 Australia">🇦🇺 Australia</option>
                    <option value="🌐 Other Region">🌐 Other Country / Region</option>
                </select>
            </div>

            <!-- 下一步按鈕 -->
            <button onclick="goToCustomizer()" class="oops-btn w-full mt-6 text-white font-black py-3.5 rounded-xl text-base tracking-wider">
                Next: Customize Your Avatar 🎨
            </button>
        </div>

        <div class="mt-6 text-xs text-slate-500 font-medium">
            Powered by Oops! Mandarin 🍊
        </div>

    </div>

    <script>
        function goToCustomizer() {
            const name = document.getElementById('username').value.trim();
            const country = document.getElementById('country').value;
            
            if(!name) {
                alert('Please enter your name or nickname first!');
                return;
            }

            // 把資料暫存起來，準備帶到下一頁外觀設定
            localStorage.setItem('village_username', name);
            localStorage.setItem('village_country', country);

            alert(`Welcome, ${name} from ${country}! Next, we will open the character customizer.`);
            // 接下來這裡會跳轉到外觀設定頁面
        }
    </script>
</body>
</html>
